<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIC · Pauza de Trei Minute</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF8030;
  --orange-light: #FFB060;
  --purple: #2d1060;
  --bg: #06040f;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: white; }

#bgCanvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

.stage {
  position:fixed; inset:0; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}

.hint {
  position:fixed; bottom:2.5rem; left:50%; transform:translateX(-50%);
  z-index:10; font-family:'Fraunces',serif; font-size:0.72rem;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.22); font-weight:300; font-style:italic;
  animation:hintPulse 3s ease-in-out infinite; transition:opacity 0.5s;
  white-space:nowrap;
}
@keyframes hintPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
.hint.hidden { opacity:0; pointer-events:none; }

.brand {
  position:fixed; top:1.4rem; left:1.5rem; z-index:10;
  display:flex; align-items:center; gap:0.6rem; text-decoration:none;
}
.brand-text {
  font-family:'Fraunces',serif; font-size:0.78rem; font-weight:300;
  color:rgba(255,255,255,0.45); letter-spacing:0.08em;
}

/* PIC SCENE — responsive */
.pic-scene {
  position:relative;
  width:min(320px, 82vw);
  height:min(320px, 82vw);
  display:flex; align-items:center; justify-content:center;
}

.pic-main {
  position:relative; z-index:5; cursor:pointer;
  animation:picFloat 5s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}
/* PIC principal responsive */
.pic-main svg {
  width: min(210px, 55vw);
  height: auto;
}
@keyframes picFloat {
  0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px)} 70%{transform:translateY(-8px)}
}

.candle-glow {
  position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  width:min(220px,58vw); height:100px;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,180,80,0.5) 0%, rgba(255,130,40,0.2) 35%, transparent 70%);
  border-radius:50%; z-index:4; filter:blur(6px);
  animation:candleFlicker 4s ease-in-out infinite; pointer-events:none;
}
@keyframes candleFlicker {
  0%,100%{opacity:0.8;transform:translateX(-50%) scaleX(1)}
  30%{opacity:1;transform:translateX(-50%) scaleX(1.1)}
  60%{opacity:0.7;transform:translateX(-50%) scaleX(0.92)}
}

.pic-shadow {
  position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  width:min(160px,42vw); height:16px;
  background:radial-gradient(ellipse, rgba(50,20,5,0.4) 0%, transparent 70%);
  border-radius:50%; z-index:3;
  animation:shadowFloat 5s ease-in-out infinite; pointer-events:none;
}
@keyframes shadowFloat {
  0%,100%{transform:translateX(-50%) scaleX(1);opacity:0.5}
  40%{transform:translateX(-50%) scaleX(0.65);opacity:0.18}
  70%{transform:translateX(-50%) scaleX(0.8);opacity:0.3}
}

/* SATELIȚI — poziționați prin JS, CSS doar styling */
.satellite {
  position:fixed; z-index:6;
  display:flex; flex-direction:column; align-items:center; gap:0.3rem;
  cursor:pointer;
  opacity:0; transform:translate(-50%, -50%) scale(0.3);
  transition:opacity 0.35s ease, transform 0.35s ease;
  pointer-events:none; -webkit-tap-highlight-color:transparent;
}
.satellite.visible {
  opacity:1; transform:translate(-50%, -50%) scale(1);
  pointer-events:all;
}
.sat-pic { transition:transform 0.2s; display:block; }
.satellite:active .sat-pic { transform:scale(0.92); }
.sat-label {
  font-family:'Fraunces',serif; font-size:0.58rem; letter-spacing:0.14em;
  text-transform:uppercase; color:rgba(255,255,255,0.45);
  font-weight:300; white-space:nowrap; font-style:italic;
}

.pic-text {
  position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%);
  text-align:center; z-index:10; transition:opacity 0.5s; white-space:nowrap;
}
.pic-text h1 {
  font-family:'Fraunces',serif; font-size:clamp(1.3rem,3.5vw,2.2rem);
  font-weight:300; font-style:italic; color:rgba(255,255,255,0.88);
}
.pic-text h1 em { font-style:normal; color:var(--orange); }
.pic-text.hidden { opacity:0; pointer-events:none; }

/* CONTENT PANEL */
.content-panel {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center;
  padding:5rem 1.5rem 2rem; overflow-y:auto;
  opacity:0; pointer-events:none; transition:opacity 0.6s ease;
}
.content-panel.open { opacity:1; pointer-events:all; }

.back-btn {
  position:fixed; top:1.3rem; right:1.5rem; z-index:30;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.6); width:38px; height:38px; border-radius:50%;
  cursor:pointer; font-size:1rem; display:none; align-items:center;
  justify-content:center; transition:all 0.2s;
}
.back-btn:hover { background:rgba(255,255,255,0.12); color:white; }
.back-btn.show { display:flex; }

.content-title {
  font-family:'Fraunces',serif; font-size:clamp(1.4rem,3vw,2rem);
  font-weight:300; font-style:italic; text-align:center; margin-bottom:0.4rem;
}
.content-sub {
  font-size:0.82rem; color:rgba(255,255,255,0.4); text-align:center;
  margin-bottom:2rem; line-height:1.8; max-width:380px;
}

.ep-list { width:100%; max-width:520px; display:flex; flex-direction:column; gap:0.5rem; }

.ep-row {
  display:flex; align-items:center; gap:1rem;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:1rem 1.2rem; cursor:pointer; transition:all 0.25s;
}
.ep-row:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.16); transform:translateX(4px); }
.ep-num { font-size:0.58rem; font-weight:700; letter-spacing:0.14em; color:rgba(255,255,255,0.28); text-transform:uppercase; min-width:38px; }
.ep-info { flex:1; }
.ep-title { font-size:0.88rem; font-weight:500; margin-bottom:0.15rem; color:rgba(255,255,255,0.9); }
.ep-desc { font-size:0.72rem; color:rgba(255,255,255,0.38); line-height:1.4; }
.ep-dur { font-size:0.64rem; color:rgba(255,255,255,0.22); min-width:32px; text-align:right; }
.ep-play {
  width:34px; height:34px; border-radius:50%; border:none; color:white;
  font-size:0.7rem; cursor:pointer; display:flex; align-items:center;
  justify-content:center; transition:all 0.2s; flex-shrink:0;
}
.ep-play:hover { transform:scale(1.1); }
.badge-free {
  font-size:0.55rem; background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.65);
  padding:0.12rem 0.5rem; border-radius:50px; font-weight:700;
  letter-spacing:0.06em; margin-left:0.4rem; vertical-align:middle;
}

@keyframes blink {
  0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(0.08)}
}
#eyeMain { transform-origin:120px 108px; animation:blink 7s ease-in-out infinite; }

/* ===================== PLAYER FULLSCREEN ===================== */
.fs-player {
  display:flex; position:fixed; inset:0; z-index:9999;
  flex-direction:column; align-items:center; justify-content:center;
  background:#06040f;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity 0.3s ease, visibility 0.3s ease;
}
.fs-player.open {
  opacity:1; visibility:visible; pointer-events:all;
}

.fs-close {
  position:absolute; top:1.3rem; right:1.5rem;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
  color:rgba(255,255,255,0.7); width:38px; height:38px; border-radius:50%;
  cursor:pointer; font-size:0.9rem; display:flex; align-items:center;
  justify-content:center; transition:all 0.2s;
}
.fs-close:hover { background:rgba(255,255,255,0.14); color:white; }

.fs-emo-lbl {
  position:absolute; top:1.5rem; left:1.5rem;
  font-family:'Fraunces',serif; font-size:0.65rem; letter-spacing:0.2em;
  text-transform:uppercase; color:rgba(255,255,255,0.3); font-style:italic;
}

.fs-pic-wrap {
  position:relative; margin-bottom:1.8rem;
  width:min(200px,52vw); height:min(200px,52vw);
  display:flex; align-items:center; justify-content:center;
}
.fs-glow {
  position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
  width:130%; height:60px;
  background:radial-gradient(ellipse, rgba(179,157,219,0.4) 0%, transparent 70%);
  border-radius:50%; filter:blur(4px);
  animation:glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:0.6;transform:translateX(-50%) scaleX(1)} 50%{opacity:1;transform:translateX(-50%) scaleX(1.2)} }

#fsPic { width:100%; height:100%; animation:picFloat 4s ease-in-out infinite; }

.fs-title {
  font-family:'Fraunces',serif; font-size:clamp(1.1rem,3vw,1.6rem);
  font-weight:300; font-style:italic; text-align:center;
  color:rgba(255,255,255,0.9); margin-bottom:0.3rem; padding:0 1.5rem;
}
.fs-sub {
  font-size:0.75rem; color:rgba(255,255,255,0.35); text-align:center;
  margin-bottom:2rem; letter-spacing:0.08em;
}

.fs-prog-wrap { width:min(300px,78vw); margin-bottom:1.8rem; }
.fs-time {
  display:flex; justify-content:space-between;
  font-size:0.65rem; color:rgba(255,255,255,0.3);
  margin-bottom:0.5rem; font-family:'DM Sans',sans-serif;
}
.fs-bar {
  height:3px; background:rgba(255,255,255,0.1);
  border-radius:3px; overflow:hidden; cursor:pointer; position:relative;
}
.fs-fill {
  height:100%; width:0%; border-radius:3px;
  transition:width 0.5s linear;
}

.fs-controls { display:flex; align-items:center; gap:2rem; }
.fs-skip {
  background:none; border:none; color:rgba(255,255,255,0.4);
  cursor:pointer; padding:0.4rem; font-family:'DM Sans',sans-serif;
  font-size:0.72rem; letter-spacing:0.04em; transition:color 0.2s;
}
.fs-skip:hover { color:rgba(255,255,255,0.75); }
.fs-play {
  width:62px; height:62px; border-radius:50%; border:none; color:white;
  font-size:1.2rem; cursor:pointer;
  box-shadow:0 8px 24px rgba(100,60,180,0.45);
  transition:all 0.25s; display:flex; align-items:center; justify-content:center;
}
.fs-play:hover { transform:scale(1.07); }
</style>
</head>

<script>
// BACKGROUND
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const blobs = [
  {x:0.2,y:0.3,r:0.32,vx:0.00010,vy:0.00007,color:'rgba(180,100,255,',base:0.10},
  {x:0.75,y:0.55,r:0.28,vx:-0.00008,vy:0.00010,color:'rgba(255,120,60,',base:0.08},
  {x:0.5,y:0.15,r:0.25,vx:0.00006,vy:-0.00011,color:'rgba(80,180,255,',base:0.07},
  {x:0.1,y:0.8,r:0.22,vx:0.00013,vy:-0.00005,color:'rgba(255,180,80,',base:0.06},
  {x:0.9,y:0.2,r:0.20,vx:-0.00010,vy:0.00012,color:'rgba(120,255,180,',base:0.05},
];
const particles = [];
for(let i=0;i<100;i++){
  particles.push({x:Math.random(),y:Math.random(),size:Math.random()*1.6+0.3,speed:Math.random()*0.00007+0.00002,angle:Math.random()*Math.PI*2,opacity:Math.random()*0.45+0.08,ts:Math.random()*0.018+0.004,to:Math.random()*Math.PI*2});
}
const waves=[
  {amp:0.055,freq:1.1,speed:0.00035,phase:0,y:0.38,color:'rgba(180,100,255,',op:0.055},
  {amp:0.045,freq:0.85,speed:0.00028,phase:1.5,y:0.52,color:'rgba(80,200,255,',op:0.045},
  {amp:0.065,freq:1.4,speed:0.00042,phase:3,y:0.68,color:'rgba(255,140,80,',op:0.038},
];
let t=0;
function drawBG(){
  t++;
  ctx.fillStyle='#06040f'; ctx.fillRect(0,0,W,H);
  blobs.forEach(b=>{
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<-0.2||b.x>1.2)b.vx*=-1; if(b.y<-0.2||b.y>1.2)b.vy*=-1;
    const r=(b.r+Math.sin(t*0.0004+b.x*3)*0.015)*Math.min(W,H);
    const g=ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,r);
    g.addColorStop(0,b.color+(b.base+0.03)+')'); g.addColorStop(0.45,b.color+b.base+')'); g.addColorStop(1,b.color+'0)');
    ctx.beginPath(); ctx.arc(b.x*W,b.y*H,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  });
  waves.forEach(w=>{
    w.phase+=w.speed; ctx.beginPath(); ctx.moveTo(0,w.y*H);
    for(let x=0;x<=W;x+=5){const y=w.y*H+Math.sin(x*w.freq*0.006+w.phase)*w.amp*H+Math.sin(x*w.freq*0.003+w.phase*1.3)*w.amp*0.4*H; ctx.lineTo(x,y);}
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
    const g=ctx.createLinearGradient(0,w.y*H-w.amp*H,0,w.y*H+w.amp*H*2);
    g.addColorStop(0,w.color+w.op+')'); g.addColorStop(0.5,w.color+(w.op*0.5)+')'); g.addColorStop(1,w.color+'0)');
    ctx.fillStyle=g; ctx.fill();
  });
  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed; p.y+=Math.sin(p.angle)*p.speed*0.5; p.angle+=(Math.random()-0.5)*0.008;
    if(p.x<-0.01)p.x=1.01; if(p.x>1.01)p.x=-0.01; if(p.y<-0.01)p.y=1.01; if(p.y>1.01)p.y=-0.01;
    const tw=Math.sin(t*p.ts+p.to)*0.4+0.6;
    ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.size,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,255,${p.opacity*tw})`; ctx.fill();
  });
  requestAnimationFrame(drawBG);
}
drawBG();

// URL Worker Cloudflare — returneaza lista fisierelor din R2
const WORKER_URL = 'https://pic-audio-list.cabinet-cristina.workers.dev';

const BASE_URL = 'https://audio.picaudio.app/';
const PREFIX = {
  eu:         { somn:'somn', tristete:'tristete', fericire:'fericire', frica:'frica', furie:'furie', exercitii:'exercitii' },
  mic:        { somn:'somnmic', tristete:'tristetemic', fericire:'fericiremic', frica:'fricamic', furie:'furiemic', exercitii:'exercitimic' },
  mijlociu:   { somn:'somnmijlociu', tristete:'tristetemijlociu', fericire:'fericireMijlociu', frica:'fricaMijlociu', furie:'furieMijlociu', exercitii:'exercitiMijlociu' },
  adolescent: { somn:'somnadolescent', tristete:'tristeteadolescent', fericire:'fericireAdolescent', frica:'fricaAdolescent', furie:'furieAdolescent', exercitii:'exercitiAdolescent' },
};

function getAudioUrl(mod, emotie, nr) {
  const p = (PREFIX[mod] || PREFIX.eu)[emotie] || emotie;
  return BASE_URL + p + nr + '.mp3';
}

// Cache local al fisierelor existente — se incarca o singura data
let fisiereCached = null;

async function getFisiere() {
  if (fisiereCached) return fisiereCached;
  try {
    const r = await fetch(WORKER_URL);
    fisiereCached = await r.json();
  } catch(e) {
    fisiereCached = [];
  }
  return fisiereCached;
}

async function deschideEmotie(emotie) {
  const data = (episoadeMod[modCurent] && episoadeMod[modCurent][emotie])

  document.getElementById('pG1').setAttribute('stop-color', data.c1);

  // Ia lista fisierelor din Worker
  const fisiere = await getFisiere();

  epList.innerHTML = '';
  data.eps.forEach((ep, i) => {
    const nr = i + 1;
    const p = (PREFIX[modCurent] || PREFIX.eu)[emotie] || emotie;
    const numeFisier = p + nr + '.mp3';
    const activ = fisiere.includes(numeFisier);
    const url = BASE_URL + numeFisier;
    const isFree = i === 0;

    const row = document.createElement('div');
    row.className = 'ep-row';
    row.innerHTML = `
      <span class="ep-num">${ep.num}</span>
      <div class="ep-info">
        <div class="ep-title">${ep.title}${isFree ? '<span class="badge-free">GRATUIT</span>' : ''}</div>
        <div class="ep-desc">${ep.desc}</div>

      <button class="ep-play"
        style="background:${activ ? `linear-gradient(135deg,${data.c1},${data.c3})` : 'rgba(255,255,255,0.1)'};
               opacity:${activ ? 1 : 0.3}; cursor:${activ ? 'pointer' : 'default'}"
        ${activ ? `onclick="deschidePlayer('${ep.title.replace(/'/g,"\\'")}','${url}','${data.c1}','${data.c3}','${data.title}')"` : ''}>▶</button>
    `;
    epList.appendChild(row);
  });
}

let satelitiVisible = false;
let ppAngle = 0;

function animatePicPoveste() {
  const pp = document.getElementById('picPoveste');
  if(pp) {
    ppAngle += 0.004 + Math.sin(ppAngle * 0.4) * 0.0008;
    const x = Math.cos(ppAngle) * 175;
    const y = Math.sin(ppAngle * 0.65) * 95;
    pp.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  }
  requestAnimationFrame(animatePicPoveste);
}
animatePicPoveste();

// Poziționare sateliți în funcție de dimensiunea ecranului
function pozitionareSateliti() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  // Raza: cât de departe de PIC, limitată să nu iasă din ecran
  const minDim = Math.min(window.innerWidth, window.innerHeight);
  const raza = Math.min(minDim * 0.38, 155);
  // Unghiurile pentru 6 sateliți (pornind de sus, sensul acelor)
  // 0=sus, 1=dreapta-sus, 2=dreapta-jos, 3=jos, 4=stânga-jos, 5=stânga-sus
  const unghiuri = [-90, -30, 30, 90, 150, -150];
  for(let i = 0; i < 6; i++) {
    const sat = document.getElementById('sat'+i);
    if(!sat) continue;
    const rad = unghiuri[i] * Math.PI / 180;
    const x = cx + Math.cos(rad) * raza;
    const y = cy + Math.sin(rad) * raza;
    sat.style.left = x + 'px';
    sat.style.top  = y + 'px';
  }
}
pozitionareSateliti();
window.addEventListener('resize', pozitionareSateliti);

function toggleSateliti() {
  if(satelitiVisible) {
    satelitiVisible = false;
    for(let i=0;i<6;i++) document.getElementById('sat'+i).classList.remove('visible');
    const pp = document.getElementById('picPoveste');
    pp.style.opacity='0'; pp.style.pointerEvents='none';
    document.getElementById('varstaOverlay').style.display='flex';
    return;
  }
  satelitiVisible = true;
  for(let i=0;i<6;i++){
    const sat = document.getElementById('sat'+i);
    setTimeout(()=>sat.classList.add('visible'), i*55);
  }
  const pp = document.getElementById('picPoveste');
  setTimeout(()=>{ pp.style.opacity='1'; pp.style.pointerEvents='all'; }, 350);
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('picText').classList.add('hidden');
}

function deschidePlayer(title, src, c1, c3, emoLbl) {
  const pl = document.getElementById('fsPlayer');
  document.getElementById('fsTitle').textContent = title;
  document.getElementById('fsLbl').textContent = emoLbl || '';
  document.getElementById('fsC1').setAttribute('stop-color', c1);
  document.getElementById('fsC2').setAttribute('stop-color', c1);
  document.getElementById('fsC3').setAttribute('stop-color', c3);
  document.getElementById('fsFill').style.background = `linear-gradient(90deg,${c1},${c3})`;
  document.getElementById('fsPlayBtn').style.background = `linear-gradient(135deg,${c1},${c3})`;
  document.getElementById('fsGlow').style.background = `radial-gradient(ellipse, ${c1}88 0%, transparent 70%)`;
  pl.style.background = `radial-gradient(ellipse at 50% 35%, ${c3}55 0%, #06040f 70%)`;

  const audio = document.getElementById('fsAudio');
  audio.src = src;
  audio.load();
  document.getElementById('fsFill').style.width = '0%';
  document.getElementById('fsCrt').textContent = '0:00';
  document.getElementById('fsDur').textContent = '--:--';
  document.getElementById('fsPlayBtn').textContent = '▶';

  // Ascunde TOT restul
  document.getElementById('contentPanel').style.visibility = 'hidden';
  document.getElementById('backBtn').style.visibility = 'hidden';
  document.querySelector('.stage').style.visibility = 'hidden';
  document.querySelector('.pic-text').style.visibility = 'hidden';
  document.getElementById('bgCanvas').style.visibility = 'hidden';

  pl.classList.add('open');
  document.body.style.overflow = 'hidden';
  history.pushState({player: true}, '');
}

function inchidePlayer() {
  document.getElementById('fsPlayer').classList.remove('open');
  document.getElementById('fsAudio').pause();
  document.getElementById('fsPlayBtn').textContent = '▶';
  document.body.style.overflow = '';
  // Readuc tot
  document.getElementById('contentPanel').style.visibility = 'visible';
  document.getElementById('backBtn').style.visibility = 'visible';
  document.querySelector('.stage').style.visibility = 'visible';
  document.querySelector('.pic-text').style.visibility = 'visible';
  document.getElementById('bgCanvas').style.visibility = 'visible';
}

function togglePlay() {
  const audio = document.getElementById('fsAudio');
  const btn = document.getElementById('fsPlayBtn');
  if(audio.paused) {
    audio.play().then(()=>{ btn.textContent = '⏸'; }).catch(()=>{ btn.textContent = '▶'; });
  } else {
    audio.pause();
    btn.textContent = '▶';
  }
}

function skipAudio(s) {
  const a = document.getElementById('fsAudio');
  a.currentTime = Math.max(0, Math.min(a.duration || 0, a.currentTime + s));
}

document.getElementById('fsBar').addEventListener('click', function(e) {
  const a = document.getElementById('fsAudio');
  if(!a.duration) return;
  const r = this.getBoundingClientRect();
  a.currentTime = ((e.clientX - r.left) / r.width) * a.duration;
});

function fmt(s) {
  const m = Math.floor(s / 60);
  return m + ':' + (Math.floor(s % 60) < 10 ? '0' : '') + Math.floor(s % 60);
}

document.getElementById('fsAudio').addEventListener('timeupdate', function() {
  if(this.duration) {
    document.getElementById('fsFill').style.width = (this.currentTime / this.duration * 100) + '%';
    document.getElementById('fsCrt').textContent = fmt(this.currentTime);
  }
});
document.getElementById('fsAudio').addEventListener('loadedmetadata', function() {
  document.getElementById('fsDur').textContent = fmt(this.duration);
});
document.getElementById('fsAudio').addEventListener('ended', function() {
  document.getElementById('fsPlayBtn').textContent = '▶';
});

window.addEventListener('popstate', function() {
  const pl = document.getElementById('fsPlayer');
  if(pl.classList.contains('open')) inchidePlayer();
});

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex, 16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}
